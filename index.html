<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorgito el curioso.💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #2b1b22;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #ffffff;
    }

    /* 💌 CONTENEDOR PRINCIPAL QUE OCUPA TODA LA PANTALLA */
    .carta-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    /* GIF DE LA CARTA EN EL FONDO */
    .gif-carta {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* TEXTO DE INSTRUCCIÓN FLOTANTE */
    .indicacion-clic {
      position: absolute;
      bottom: 40px;
      background-color: rgba(255, 182, 193, 0.95);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: bold;
      text-shadow: 1px 1px 2px #d87093;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      animation: pulsoTexto 1.8s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulsoTexto {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* 🌧️ LLUVIA DE CORAZONES (💕,💞,💖,💘,💗) */
    .corazon-lluvia {
      position: absolute;
      top: -40px;
      font-size: 2rem;
      user-select: none;
      pointer-events: none;
      z-index: 100;
      animation: caerCorazon linear infinite;
    }

    @keyframes caerCorazon {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* 📦 MODAL / CAJA DE TEXTO BONITA */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.activo {
      opacity: 1;
      pointer-events: auto;
    }

    .caja-mensaje {
      background-color: #ffd1dc;
      border: 4px solid #ff94b4;
      border-radius: 25px;
      padding: 25px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(255, 148, 180, 0.5);
      transform: scale(0.7);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-overlay.activo .caja-mensaje {
      transform: scale(1);
    }

    .titulo-mensaje {
      font-size: 1.8rem;
      color: #2b1b22;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 1px 1px 0px #ffffff;
    }

    /* GIF DEL OSITO */
    .gif-osito-beso {
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .btn-cerrar {
      background-color: #ff94b4;
      color: #ffffff;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      border: 3px solid #ffffff;
      padding: 12px 30px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0px #d87093;
      transition: all 0.2s ease;
    }

    .btn-cerrar:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0px #d87093;
    }

    /* 🌸 PANTALLA FINAL DE AGRADECIMIENTO */
    .pantalla-agradecimiento {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #2b1b22;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      text-align: center;
      padding: 20px;
    }

    .pantalla-agradecimiento.activa {
      opacity: 1;
      pointer-events: auto;
    }

    .tarjeta-final {
      background-color: rgba(255, 209, 220, 0.15);
      border: 3px dashed #ff94b4;
      padding: 35px 25px;
      border-radius: 25px;
      backdrop-filter: blur(5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      max-width: 420px;
      width: 90%;
      animation: flotarTarjeta 3s infinite ease-in-out;
    }

    @keyframes flotarTarjeta {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .tarjeta-final h1 {
      font-size: 2rem;
      color: #ff94b4;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .tarjeta-final p {
      font-size: 1.1rem;
      color: #ffe4e1;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .corazon-final {
      font-size: 3.5rem;
      animation: latido 1.2s infinite ease-in-out;
    }

    @keyframes latido {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
  </style>
</head>
<body>

  <!-- 💌 VISTA DE LA CARTA DE FONDO -->
  <div class="carta-container" id="carta-principal" onclick="abrirCarta()">
    <img src="https://i.ibb.co/MkfBpnqN/carta-ezgif-com-remove-background.gif" alt="Carta para Jorgito" class="gif-carta">
    <div class="indicacion-clic">¡Tap! ✨</div>
  </div>

  <!-- 📦 CAJA DE TEXTO BONITA (MODAL) -->
  <div class="modal-overlay" id="modal-mensaje">
    <div class="caja-mensaje">
      <h2 class="titulo-mensaje">Mi Jorgito Lindo 💕</h2>
      
      <!-- GIF DEL OSITO DANDO UN BESO -->
      <img src="https://i.ibb.co/NgMVcv8d/beso-ezgif-com-remove-background.gif" alt="Osito beso" class="gif-osito-beso">
      
      <!-- BOTÓN CERRAR -->
      <button class="btn-cerrar" onclick="cerrarYMostrarAgradecimiento(event)">Cerrar ❣️</button>
    </div>
  </div>

  <!-- 🌸 PANTALLA FINAL DE AGRADECIMIENTO -->
  <div class="pantalla-agradecimiento" id="pantalla-final">
    <div class="tarjeta-final">
      <h1>✨💖</h1>
      <p>Con amor para ti.💞</p>
      <div class="corazon-final">💖</div>
    </div>
  </div>

  <script>
    let intervaloCorazones;
    const listaCorazones = ['💕', '💞', '💖', '💘', '💗'];

    function abrirCarta() {
      document.getElementById('modal-mensaje').classList.add('activo');
      iniciarLluviaCorazones();
    }

    function iniciarLluviaCorazones() {
      if (intervaloCorazones) clearInterval(intervaloCorazones);

      intervaloCorazones = setInterval(() => {
        const corazon = document.createElement('div');
        corazon.classList.add('corazon-lluvia');
        
        const corazonRandom = listaCorazones[Math.floor(Math.random() * listaCorazones.length)];
        corazon.innerHTML = corazonRandom;

        corazon.style.left = Math.random() * 95 + '%';
        corazon.style.animationDuration = (Math.random() * 2.5 + 2.5) + 's';
        
        document.body.appendChild(corazon);

        setTimeout(() => corazon.remove(), 5500);
      }, 300);
    }

    function detenerLluviaCorazones() {
      clearInterval(intervaloCorazones);
      document.querySelectorAll('.corazon-lluvia').forEach(c => c.remove());
    }

    function cerrarYMostrarAgradecimiento(event) {
      event.stopPropagation();

      // Cierra el modal y detiene los corazones
      document.getElementById('modal-mensaje').classList.remove('activo');
      detenerLluviaCorazones();

      // Muestra la pantalla final con animación
      setTimeout(() => {
        document.getElementById('carta-principal').style.opacity = '0';
        document.getElementById('pantalla-final').classList.add('activa');
      }, 300);
    }
  </script>

</body>
</html>
